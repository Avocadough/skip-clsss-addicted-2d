name: Deploy game to GitHub Pages

# Publishes the exported Godot web build in docs/ to GitHub Pages.
# Using the Actions source (rather than the branch/folder setting) means the
# site is configured entirely from this file — configure-pages turns Pages on
# by itself the first time this runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Turn Pages on and read its settings
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the exported web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
